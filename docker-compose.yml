name: ecokaz

services:
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    # Only what Caddy needs: the database credentials stay out of this container.
    environment:
      ECOKAZ_HOST: ${ECOKAZ_HOST:-localhost}
      ECOKAZ_HSTS_MAX_AGE: ${ECOKAZ_HSTS_MAX_AGE:-0}
    ports:
      - "8090:8090"
      - "8453:8453"
    volumes:
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:

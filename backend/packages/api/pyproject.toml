[project]
name = "ecokaz-api"
version = "0.0.0"
description = "Ecokaz HTTP API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ecokaz-core",
    "fastapi>=0.120",
    "pydantic-settings>=2.11",
    "uvicorn[standard]>=0.38",
    "sqlalchemy>=2.0",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
ecokaz-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
